[project]
name = "meccano-shovel"
version = "0.1.0"
description = "A MuJoCo model of a Meccano steam shovel, built part by part on the 1/2-inch hole grid"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.26",
    "trimesh>=4.0",
    "shapely>=2.0",
    "mapbox-earcut>=1.0",
    "manifold3d>=2.4",
    "imageio[ffmpeg]>=2.34",
    "pillow>=10",
]

[tool.uv]
package = false
