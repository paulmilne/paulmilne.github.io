project:
  type: website
  output-dir: docs          # GitHub Pages: serve from /docs on the main branch
  resources:
    - .nojekyll             # keep this copied into docs/ on every render (disables Jekyll)
    - google4c03b5aad3fcd4a0.html  # Google Search Console ownership verification
  render:
    - "*.qmd"
    - "posts/**"
    - "explainers/**"
    - "probability/**"
    - "cosmology/**"
    - "astronomy/**"
    - "sci-fi/**"
    - "mechanics/**"
    - "electronics/**"
    - "complexity/**"
    - "papers/**"
    - "ai/**"
    - "space/**"
    - "geb/**"
    - "economics/**"
    - "!dl/"                # research working tree, not a site page
    - "!GEMINI.md"          # assistant notes, not a site page
    - "!CLASS_option_evaluation.qmd"  # needs local Excel data, not a site page

website:
  title: "math-blog"
  site-url: "https://paulmilne.github.io"
  description: "Paul Milne's blog on mathematics, physics and engineering, worked through in code: probability and statistics, cosmology and astronomy, mechanics, electronics and spaceflight, AI, paper reproductions and original research."
  open-graph: true
  twitter-card: true
  navbar:
    collapse-below: xl     # the full bar needs about 1100px; use the menu button below 1200px
    left:
      - href: index.qmd
        text: Posts
      - href: explainers/index.qmd
        text: Explainers
      - href: papers/index.qmd
        text: Papers
      - text: Maths
        menu:
          - href: probability/index.qmd
            text: Probability
          - href: geb/index.qmd
            text: GEB
          - href: complexity/index.qmd
            text: Complexity
      - text: Physics & Space
        menu:
          - href: cosmology/index.qmd
            text: Cosmology
          - href: astronomy/index.qmd
            text: Astronomy
          - href: space/index.qmd
            text: Space
          - href: mechanics/index.qmd
            text: Mechanics
      - text: Engineering
        menu:
          - href: electronics/index.qmd
            text: Electronics
          - href: ai/index.qmd
            text: AI
      - href: economics/index.qmd
        text: Economics
      - href: sci-fi/index.qmd
        text: Sci-Fi
    right:
      - about.qmd
      - icon: linkedin
        href: https://www.linkedin.com/in/paulmilne/
      - icon: github
        href: https://github.com/paulmilne
format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    include-in-header:
      text: |
        <script data-goatcounter="https://pmilne.goatcounter.com/count"
                async src="//gc.zgo.at/count.js"></script>



