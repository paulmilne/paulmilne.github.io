project:
  type: website
  output-dir: docs          # GitHub Pages: serve from /docs on the main branch
  resources:
    - .nojekyll             # keep this copied into docs/ on every render (disables Jekyll)
  render:
    - "*.qmd"
    - "posts/**"
    - "explainers/**"
    - "!dl/"                # research working tree, not a site page
    - "!GEMINI.md"          # assistant notes, not a site page

website:
  title: "math-blog"
  navbar:
    left:
      - href: index.qmd
        text: Posts
      - href: explainers/index.qmd
        text: Explainers
    right:
      - about.qmd
      - icon: github
        href: https://github.com/
      - icon: twitter
        href: https://twitter.com
format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css



