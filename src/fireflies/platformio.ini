; ESP32 fireflies: pulse-coupled oscillators over ESP-NOW.
; Flash the same firmware to every node. Build the "logger" environment for one
; extra board on USB that only listens and prints every flash it hears.

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

[env:node]
board = esp32dev
build_flags = -DLED_PIN=2

[env:node_s3]
board = esp32-s3-devkitc-1
build_flags = -DLED_PIN=2

; ESP32-C3 SuperMini (the cheapest option): LED on GPIO 8, active low; Serial over native USB.
[env:node_c3]
board = esp32-c3-devkitm-1
build_flags = -DLED_PIN=8 -DLED_ACTIVE_LOW -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:logger_c3]
board = esp32-c3-devkitm-1
build_flags = -DLOGGER -DLED_PIN=8 -DLED_ACTIVE_LOW -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:logger]
board = esp32dev
build_flags = -DLOGGER -DLED_PIN=2
